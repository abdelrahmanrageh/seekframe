<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seekframe — Motion Study</title>
<link rel="stylesheet" href="brand/brand.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#F4F2EB;--ink:#11120F;--soft:#D8D5CC;--accent:#B8FF00;--hero-size:244px}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--paper)}
body{font-family:var(--font-display,system-ui,sans-serif);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--paper);isolation:isolate}
.back{position:absolute;inset:0;background:radial-gradient(ellipse at 78% 42%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 34%),var(--paper);transition:none}
.grid{position:absolute;inset:0;opacity:.11;background-image:linear-gradient(to right,var(--ink) 1px,transparent 1px),linear-gradient(to bottom,var(--ink) 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(to right,transparent,black 20%,black 85%,transparent)}
.scene{position:absolute;inset:0;display:none;overflow:hidden;padding:48px 70px 42px}
.meta{position:absolute;top:34px;left:70px;right:70px;display:flex;justify-content:space-between;font:700 11px/1 var(--font-text,system-ui,sans-serif);letter-spacing:.16em;z-index:4}
.scene-no{position:absolute;right:70px;bottom:38px;font-size:12px;font-weight:800;letter-spacing:.14em;z-index:4}
.brand-mark{position:absolute;right:66px;top:28px;z-index:8;width:82px;height:44px;object-fit:contain;mix-blend-mode:multiply}
.intro-composition{position:absolute;inset:130px 70px 80px;display:flex;align-items:center;justify-content:center}
.hero-word,.echo{position:absolute;white-space:nowrap;font-size:var(--hero-size);line-height:.78;letter-spacing:-.095em;font-weight:950;text-transform:uppercase}
.hero-word{z-index:2;color:var(--ink);transform-origin:center;max-width:1100px;overflow:hidden}
.echo{z-index:1;color:var(--ink);text-shadow:10px 10px 0 var(--accent)}
.stamp{position:absolute;z-index:3;left:3%;top:4%;padding:10px 14px;background:var(--accent);font-size:11px;font-weight:900;line-height:1.1;letter-spacing:.12em;transform:rotate(-8deg)}
.slash{position:absolute;z-index:1;width:112%;height:38px;background:var(--accent);transform:rotate(-7deg) scaleX(0);mix-blend-mode:multiply}
.sub{position:absolute;z-index:3;bottom:3%;left:5%;font-size:20px;font-weight:650;letter-spacing:-.03em}.edge-note{position:absolute;right:72px;top:50%;font-size:12px;line-height:1.4;font-weight:850;letter-spacing:.12em;writing-mode:vertical-rl;transform:translateY(-50%)}
.identity-head{position:absolute;left:9%;top:28%;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:22px;line-height:.82;transform:translateY(var(--rise,0px));font-size:90px;font-weight:950;letter-spacing:-.085em}.identity-head span:first-child{font-size:19px;letter-spacing:.12em;align-self:end}.identity-head b{grid-column:1 / 3;font-size:206px;line-height:.8;letter-spacing:-.11em}.identity-head span:last-child{grid-column:1 / 3;font-size:54px;letter-spacing:-.07em;justify-self:end}
.swatch-row{position:absolute;right:10%;top:30%;width:180px;height:300px;display:flex;flex-direction:column;gap:8px;transform:rotate(8deg)}.swatch-row i{display:block;flex:1;background:var(--accent);box-shadow:8px 8px 0 var(--ink);transform:scaleX(0)}.swatch-row i:nth-child(2){background:var(--ink)}.swatch-row i:nth-child(3){background:var(--soft)}.swatch-row i:nth-child(4){background:var(--accent)}.swatch-row i:nth-child(5){background:var(--ink)}
.identity-footer{position:absolute;left:70px;right:70px;bottom:48px;display:flex;justify-content:space-between;align-items:center}.caption{font-size:16px;font-weight:900;letter-spacing:.09em}.micro{font-size:10px;font-weight:700;letter-spacing:.16em}
.motion-layout{position:absolute;inset:120px 8% 76px;display:grid;grid-template-columns:42% 58%;align-items:center}.motion-copy{position:relative;display:flex;flex-direction:column;align-items:flex-start}.oversize{font-size:260px;line-height:.7;letter-spacing:-.11em;font-weight:950}.oversize span{display:inline-block;padding:0 .06em;color:var(--ink);background:var(--accent);font-size:150px;vertical-align:top;letter-spacing:-.1em}.motion-caption{margin:30px 0 0 12px;font-size:13px;line-height:1.35;font-weight:850;letter-spacing:.17em}
.beats{display:grid;gap:12px}.beat{position:relative;display:grid;grid-template-columns:56px 1fr;align-items:center;gap:14px;min-height:86px;padding:15px 18px;background:color-mix(in srgb,var(--paper) 70%,var(--soft));border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);box-shadow:5px 5px 0 var(--ink);font-size:25px;font-weight:800;letter-spacing:-.04em}.beat b{font-size:13px;color:var(--accent);background:var(--ink);padding:8px;text-align:center}.beat i{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--accent);transform-origin:left}
.variant-title{position:absolute;left:8%;top:23%;font-size:80px;line-height:.86;letter-spacing:-.08em;font-weight:950;z-index:3}.variant-title i{font-style:normal;color:var(--ink);background:var(--accent);padding:0 .03em}.variant-stage{position:absolute;left:38%;right:8%;top:23%;bottom:13%;perspective:900px}.v-tile{position:absolute;width:42%;height:62%;padding:18px 22px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid var(--ink);background:var(--paper);box-shadow:12px 12px 0 var(--ink);transform-style:preserve-3d}.v-tile span{font-size:13px;font-weight:900}.v-tile b{font-size:39px;letter-spacing:-.08em}.v-tile i{height:20%;background:var(--accent);border:1px solid var(--ink)}.v-a{left:0;top:4%;z-index:1}.v-b{left:29%;top:21%;z-index:2;background:var(--accent)}.v-c{left:54%;top:2%;z-index:3;background:var(--ink);color:var(--paper)}.v-c i{background:var(--paper)}
.outro{display:grid;place-content:center;justify-items:center;text-align:center}.outro-mark{position:absolute;top:13%;display:flex;align-items:center;gap:7px;color:var(--ink);font-size:54px;font-weight:950;letter-spacing:-.1em}.outro-mark i{width:48px;height:12px;background:var(--accent);transform:skewX(-28deg)}.outro-word{font-size:172px;line-height:.73;letter-spacing:-.105em;font-weight:950;text-align:left}.last-line{margin-top:36px;background:var(--accent);padding:12px 20px;font-size:20px;font-weight:850;transform:rotate(-2deg)}.outro-foot{position:absolute;left:70px;right:70px;bottom:38px;display:flex;justify-content:space-between;font-size:10px;font-weight:850;letter-spacing:.15em}
.shape-field{position:absolute;inset:0;pointer-events:none;z-index:0}.shape{position:absolute;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 24%,white 0 5%,color-mix(in srgb,var(--accent) 86%,white) 9%,var(--accent) 46%,color-mix(in srgb,var(--accent) 55%,var(--ink)) 100%);box-shadow:inset -7px -9px 14px rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.16)}
body[data-shape="tile"] .shape{border-radius:4px;box-shadow:7px 7px 0 var(--ink)}body[data-shape="ribbon"] .shape{width:70px;height:22px;border-radius:999px;background:linear-gradient(110deg,var(--accent),var(--ink),var(--accent));box-shadow:none}
body[data-shape="tile"] .v-tile{border-radius:0}body[data-shape="orb"] .v-tile{border-radius:26px}body[data-shape="ribbon"] .v-tile{border-radius:48px}
</style>
</head>
<body>
<div id="stage"></div>
<script src="brand/brand.js"></script>
<script src="../../dist/browser/runtime.js"></script>
<script src="film.js"></script>
</body>
</html>
