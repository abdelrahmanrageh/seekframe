<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seekframe motion kit demo</title>
<link rel="stylesheet" href="brand/brand.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
:root{ --bg:var(--brand-ink); --fg:#fff; --acc:var(--brand-accent); --accInk:var(--brand-ink); --u:1px; --title-size:190; }
body{font-family:var(--font-display);color:var(--fg);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.sc{position:absolute;inset:0;display:none}
.col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:72px;text-align:center}
h1{font-size:calc(var(--title-size)*1px);line-height:1.02;letter-spacing:-.04em;font-weight:800}
h2{font-size:64px;font-weight:600;opacity:.85}
.w{display:inline-block}.hl{border-radius:.16em;padding:0 .12em}
.big2{font-size:104px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.row{display:flex;gap:56px;align-items:center;justify-content:center;flex-wrap:wrap}
body .sf-pill{font-size:52px}body .sf-card{width:900px;text-align:start}body .sf-card h3{font-size:64px}body .sf-card p{font-size:44px}
body .sf-composer .in{font-size:60px;min-height:240px}body .sf-send{width:110px;height:110px;font-size:60px}
body .sf-counter .v{font-size:240px}body .sf-counter .l{font-size:48px}
body .sf-logo .word{font-size:260px}body .sf-logo .tag{font-size:44px}body .sf-bar{font-size:30px}
</style>
</head>
<body>
<div id="stage"></div>
<script src="brand/brand.js"></script>
<script src="../../dist/browser/runtime.js"></script>
<script src="film.js"></script>
</body>
</html>
