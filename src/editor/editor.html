<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seekframe Editor</title>
<link rel="icon" href="/assets/brand/favicon.png">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<a class="skip" href="#side" data-i18n="skip">Skip to the controls</a>
<header id="top" role="banner">
  <a class="brand" href="/" aria-label="Seekframe"><img src="/assets/brand/favicon.png" alt="" width="28" height="28"><b>seekframe</b></a>
  <label class="vh" for="filmSel" data-i18n="film">Film</label><select id="filmSel"></select>
  <label class="vh" for="verSel" data-i18n="version">Version</label><select id="verSel"></select>
  <button class="btn" id="newFilm" type="button" data-i18n="newFilm">New film</button>
  <button class="btn" id="saveAs" type="button" data-i18n="saveAs">Save as…</button>
  <button class="btn" id="delVer" type="button" data-i18n="delete">Delete</button>
  <button class="btn" id="hist" type="button" data-i18n="history">History</button>
  <span class="sp"></span>
  <button class="btn" id="undo" type="button" data-i18n="undo" disabled>Undo</button><button class="btn" id="redo" type="button" data-i18n="redo" disabled>Redo</button>
  <span id="saved" class="saved" role="status"></span>
  <button class="btn" id="resetAll" type="button" data-i18n="resetAll">Reset all</button>
  <button class="btn" id="setup" type="button" data-i18n="setup">Setup</button>
  <button class="btn" id="keys" type="button" data-i18n="shortcuts" aria-label="Keyboard shortcuts">Shortcuts</button>
  <button class="btn" id="theme" type="button" data-i18n-aria="theme"></button>
  <label class="vh" for="langSel" data-i18n="language">Language</label><select id="langSel"></select>
</header>
<div id="app">
  <main id="left">
    <div id="stageWrap">
      <div id="stageTools"><button class="btn sm" id="safeBtn" type="button" aria-pressed="false" data-i18n="safeArea">Safe area</button><button class="btn sm" id="checkBtn" type="button" data-i18n="checkText">Check text</button></div>
      <div id="frameBox" hidden><iframe id="film" title="Film preview"></iframe><div id="safe" hidden aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="cx"></i><i class="cy"></i></div></div>
      <div id="loading" data-i18n="loading">Loading film…</div>
    </div>
    <section id="transport" aria-label="Transport">
      <div id="bar">
        <button id="play" type="button" aria-label="Play"></button>
        <div id="time" aria-hidden="true">0:00.00<small></small></div>
        <div class="hint"><span data-i18n="hint.keys"></span><br><span data-i18n="hint.drag"></span></div>
      </div>
      <div id="scrub" role="slider" tabindex="0" aria-label="Timeline" data-i18n-aria="timeline" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
        <div id="track"><canvas id="wave" aria-hidden="true"></canvas><div id="head"></div></div>
      </div>
    </section>
  </main>
  <aside id="side" tabindex="-1">
    <div id="tabs" role="tablist" aria-label="Editor sections">
      <button role="tab" data-t="scenes" aria-controls="p-scenes" data-i18n="tab.scenes">Scenes</button>
      <button role="tab" data-t="style" aria-controls="p-style" data-i18n="tab.style">Style</button>
      <button role="tab" data-t="variants" aria-controls="p-variants" data-i18n="tab.variants">Variants</button>
      <button role="tab" data-t="brand" aria-controls="p-brand" data-i18n="tab.brand">Brand</button>
      <button role="tab" data-t="audio" aria-controls="p-audio" data-i18n="tab.audio">Audio</button>
      <button role="tab" data-t="export" aria-controls="p-export" data-i18n="tab.export">Export</button>
    </div>
    <div class="pane" id="p-scenes" role="tabpanel"></div>
    <div class="pane" id="p-style" role="tabpanel" hidden></div>
    <div class="pane" id="p-variants" role="tabpanel" hidden></div>
    <div class="pane" id="p-brand" role="tabpanel" hidden></div>
    <div class="pane" id="p-audio" role="tabpanel" hidden></div>
    <div class="pane" id="p-export" role="tabpanel" hidden>
      <div class="field" id="sizeField"><label for="size" data-i18n="size">Size</label><select id="size"></select></div>
      <div class="field"><label for="fps" data-i18n="export.fps">Frame rate</label><select id="fps"><option value="30" data-i18n="export.fps30">30 fps (draft)</option><option value="60" selected data-i18n="export.fps60">60 fps (final)</option><option value="24" data-i18n="export.fps24">24 fps</option></select></div>
      <p class="note" id="outname"></p>
      <label class="sw"><input type="checkbox" id="notify"> <span data-i18n="export.notify">Notify me when a render finishes</span></label>
      <button id="go" type="button" class="btn primary wide" data-i18n="export.add">Add to render queue</button>
      <h3 data-i18n="export.project">Project file</h3>
      <p class="note" data-i18n="export.projectNote">The whole film in one file: scenes, brand kit, saved versions and uploaded images. Send it to someone, or open it on another computer.</p>
      <div class="row"><a id="packBtn" class="btn" download data-i18n="export.pack">Export project</a> <button id="importBtn" type="button" class="btn" data-i18n="export.import">Import project…</button><input type="file" id="importFile" accept=".tgz,.gz,application/gzip" hidden></div>
      <h3 data-i18n="export.queue">Render queue</h3>
      <div id="queue" aria-live="polite"></div>
    </div>
  </aside>
</div>
<div id="live" class="vh" role="status" aria-live="polite"></div>
<script src="../browser/editor.js"></script>
</body>
</html>
