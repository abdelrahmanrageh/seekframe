name: Render Seekframe films
description: Validate films and render a film or a variant matrix to MP4, then upload the videos as an artifact.
# Usage in a Seekframe workspace (a repo that has `seekframe` as a dependency, e.g. made with `npm create seekframe`):
#   - uses: actions/checkout@v4
#   - uses: abdelrahmanrageh/seekframe/.github/actions/render@main
#     with: { film: my-film, versions: 'true', fps: '30' }
# It also works inside a clone of the Seekframe repo itself.
inputs:
  film:
    description: Film id or comma-separated film ids.
    required: true
  axes:
    description: Optional matrix axes, for example "hook=*,theme=mono|lime".
    required: false
    default: ''
  versions:
    description: Render every saved version instead of an axes matrix ("true" or "false").
    required: false
    default: 'false'
  fps:
    description: Output frame rate.
    required: false
    default: '30'
  working-directory:
    description: Folder of the workspace (where package.json lives).
    required: false
    default: '.'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: seekframe-renders
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies and Chromium
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npx playwright install --with-deps chromium
    - name: Validate and render
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FILM: ${{ inputs.film }}
        AXES: ${{ inputs.axes }}
        VERSIONS: ${{ inputs.versions }}
        FPS: ${{ inputs.fps }}
      run: |
        if [ -f bin/seekframe.js ]; then SF="node bin/seekframe.js"; else SF="npx --no-install seekframe"; fi
        IFS=',' read -ra films <<< "$FILM"
        for film in "${films[@]}"; do $SF validate "$film" --fast; done
        args=("$FILM" --fps "$FPS")
        if [ -n "$AXES" ]; then args+=(--axes "$AXES"); fi
        if [ "$VERSIONS" = "true" ]; then args+=(--versions); fi
        $SF matrix "${args[@]}"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/output/*.mp4
        if-no-files-found: error
