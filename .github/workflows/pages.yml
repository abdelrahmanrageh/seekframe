name: Publish docs site
on:
  push:
    branches: [main]
    paths: [site/**, docs/**, examples/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the static site
        run: |
          mkdir -p public
          cp site/index.html public/index.html
          mkdir -p public/examples/akked-tick/preview
          cp examples/akked-tick/preview/v1-doubt-mono.gif public/examples/akked-tick/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
