name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci          # runs the build (prepare)
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Validate and review the examples
        run: |
          node bin/seekframe.js validate examples/seekframe-launch --fast
          node bin/seekframe.js validate examples/seekframe-feature-tour --fast
          node bin/seekframe.js validate examples/seekframe-kit-demo --fast
          node bin/seekframe.js review examples/seekframe-launch --out review
          node bin/seekframe.js critique examples/seekframe-launch --version default --min-score 80 --out review
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: review-sheets, path: review/ }
