name: Render films
on:
  workflow_dispatch:
    inputs:
      film:
        description: Film id or comma-separated ids
        required: true
        default: seekframe-launch
      fps:
        description: Output frame rate
        required: true
        default: '30'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render
        with:
          film: ${{ inputs.film }}
          fps: ${{ inputs.fps }}
