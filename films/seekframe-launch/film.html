<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seekframe — brand films as code</title>
<link rel="stylesheet" href="brand/brand.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg)}
:root{ --bg:var(--brand-ink); --fg:#fff; --acc:var(--brand-accent); --accInk:var(--brand-ink); --u:1px; --title-size:92; }
body{font-family:var(--font-display);color:var(--fg);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;display:none}
.col{position:absolute;left:var(--sx);right:var(--sx);top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:calc(22*var(--u))}
[data-align=center] .col{align-items:center;text-align:center}
h1{font-size:calc(var(--title-size)*var(--u));line-height:1.05;letter-spacing:-.02em;font-weight:800}
[dir=rtl] h1{letter-spacing:0;line-height:1.25}
h2{font-size:calc(38*var(--u));font-weight:500;opacity:.8}
.bar{height:calc(10*var(--u));border-radius:calc(5*var(--u));background:var(--acc)}
.badge{align-self:flex-start;background:var(--acc);color:var(--accInk);font-weight:800;font-size:calc(22*var(--u));padding:calc(6*var(--u)) calc(16*var(--u));border-radius:999px}
[data-align=center] .badge{align-self:center}
.cards{display:flex;gap:calc(28*var(--u));width:100%}
.card{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:calc(24*var(--u));padding:calc(36*var(--u)) calc(30*var(--u));font-size:calc(34*var(--u));font-weight:700;line-height:1.2}
.card i{display:block;width:calc(44*var(--u));height:calc(44*var(--u));border-radius:50%;background:var(--acc);margin-bottom:calc(22*var(--u))}
@media (orientation:portrait){.cards{flex-direction:column}}
.big{font-size:calc(120*var(--u));font-weight:800;letter-spacing:-.03em}
#logo{position:absolute;inset-inline-end:calc(60*var(--u));top:calc(48*var(--u));height:calc(64*var(--u));display:none}
</style>
</head>
<body data-align="center">
<div id="stage"></div>
<script src="brand/brand.js"></script>
<script src="../../dist/browser/runtime.js"></script>
<script src="film.js"></script>
</body>
</html>
